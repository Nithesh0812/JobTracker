services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: nithesh08
      POSTGRES_PASSWORD: Nithesh08
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nithesh08:Nithesh08@db:5432/jobtracker
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - db
volumes:
  pgdata:
