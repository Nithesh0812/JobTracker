# Prometheus for JobTracker. Started only with the "telemetry" Compose profile.
# It scrapes the API over the internal Docker network, so /metrics never needs
# to be public. Its own UI and API are bound to 127.0.0.1:9090 on the host.

global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    service: jobtracker-api

scrape_configs:
  - job_name: jobtracker-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
