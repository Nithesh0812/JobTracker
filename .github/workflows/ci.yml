name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: continuous-integration-test-secret
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobtracker_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests on Postgres SQL
        run: pytest -q
      - name: Tests on SQLite
        run : pytest -q
        env:
          DATABASE_URL: "sqlite://"
      - name: Migrating to a test database
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobtracker_migrations
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE jobtracker_migrations"
          alembic upgrade head
          alembic check
